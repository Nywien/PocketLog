<div>
  <h3>Add Transaction</h3>
  <hr/>
  <form [formGroup]="transactionForm" (ngSubmit)="saveTransaction()">

    <div>
      <mat-form-field appearance="fill">
        <mat-label>Transaction Type</mat-label>
        <mat-select formControlName="type" required>
          <mat-option *ngFor="let type of transactionTypes" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div>
      <mat-form-field class="amount">
        <mat-label>Amount</mat-label>
        <input formControlName="amount" type="number" matInput placeholder="0">
      </mat-form-field>
    </div>

    <div>
      <mat-form-field class="description">
        <mat-label>Description</mat-label>
        <input formControlName="description" type="text" matInput placeholder="Write something...">
      </mat-form-field>
    </div>

    <div>
      <mat-form-field class="transactionDate">
        <mat-label>Choose a date</mat-label>
        <input formControlName="transactionDate" matInput [matDatepicker]="picker">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div>
      <button mat-raised-button color="primary" type="submit" [disabled]="transactionForm.invalid">
        Save Transaction
      </button>
    </div>

  </form>
</div>
